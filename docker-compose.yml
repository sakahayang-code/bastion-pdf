version: '3.8'

services:
  bastion-pdf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bastion-pdf
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/replica.db
      - STORAGE_PATH=/app/data/storage
      - RETENTION_HOURS=2
    volumes:
      - bastion-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('fs').existsSync('/app/data/replica.db') ? process.exit(0) : process.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  bastion-data:
    driver: local
